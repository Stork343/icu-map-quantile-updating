      fillColor: '#F4D8DE'
      strokeColor: '#BB5566'
      strokeWidth: 1.8
      fontWeight: 600
      fontSize: 20
      fontColor: '#1F2937'
edges:
  - from: train_stays
    to: common_model
    type: primary
  - from: common_model
    to: train_output
    type: primary
  - from: tune_stays
    to: candidate_profiles
    type: primary
  - from: train_output
    to: candidate_profiles
    type: data
    waypoints:
      - x: 792
        'y': 176
      - x: 452
        'y': 176
  - from: candidate_profiles
    to: select_rule
    type: primary
  - from: select_rule
    to: frozen_rule
    type: primary
  - from: heldout_stay
    to: index_window
    type: primary
  - from: heldout_stay
    to: later_window
    type: primary
  - from: index_window
    to: stay_profile
    type: primary
  - from: frozen_rule
    to: stay_profile
    type: data
    waypoints:
      - x: 1080
        'y': 336
      - x: 616
        'y': 336
  - from: stay_profile
    to: forecast
    type: primary
  - from: forecast
    to: stay_loss
    type: primary
  - from: later_window
    to: stay_loss
    type: primary
  - from: stay_loss
    to: aggregate
    type: primary
