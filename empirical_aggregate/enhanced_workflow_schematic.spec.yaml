meta:
  profile: academic-paper
  figureType: workflow
  source: generated
  theme: academic-color
  palette: tol-high-contrast
  layout: horizontal
  canvas: 1200x576
  routing: orthogonal
  print:
    target: ieee-double
  font:
    primary: Times New Roman
    cjk: Times New Roman,SimSun
    formula: Times New Roman
  title: Cross fitted lower tail forecasting workflow
  description: Separate training, tuning, and held-out assessment paths for profiled lower tail MAP prediction.
  legend: Solid connectors carry records or predictions. Dashed connectors carry parameters frozen before assessment.
modules:
  - id: training
    label: 1  TRAINING
    style:
      fillColor: '#F3F7FB'
      strokeColor: '#9CBBD0'
      dashed: false
      rounded: 10
  - id: tuning
    label: 2  TUNING
    style:
      fillColor: '#FFF9EC'
      strokeColor: '#D6B65F'
      dashed: false
      rounded: 10
  - id: assessment
    label: 3  HELD-OUT ASSESSMENT
    style:
      fillColor: '#FBF2F4'
      strokeColor: '#CB8C99'
      dashed: false
      rounded: 10
nodes:
  - id: train_stays
    label: |-
      Training stays
      outer fit 60%
    type: process
    module: training
    bounds:
      x: 48
      'y': 72
      width: 200
      height: 64
    style:
      fillColor: '#FFFFFF'
      strokeColor: '#004488'
      strokeWidth: 1.5
      fontSize: 20
      fontColor: '#1F2937'
  - id: common_model
    label: |-
      Fit common rule
      covariates + ICU time
    type: process
    module: training
    bounds:
      x: 304
      'y': 72
      width: 296
      height: 64
    style:
      fillColor: '#EAF2F8'
      strokeColor: '#004488'
      strokeWidth: 1.5
      fontSize: 20
      fontColor: '#1F2937'
  - id: train_output
    label: |-
      Population quantile
      common rule
    type: process
    module: training
    bounds:
      x: 664
      'y': 72
      width: 240
      height: 64
    style:
      fillColor: '#FFFFFF'
      strokeColor: '#004488'
      strokeWidth: 1.5
      fontSize: 20
      fontColor: '#1F2937'
  - id: tune_stays
    label: |-
      Tuning stays
      outer fit 20%
    type: process
    module: tuning
    bounds:
      x: 48
      'y': 224
      width: 200
      height: 64
    style:
      fillColor: '#FFFFFF'
      strokeColor: '#DDAA33'
      strokeWidth: 1.5
      fontSize: 20
      fontColor: '#1F2937'
  - id: candidate_profiles
